<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" role="img" aria-label="Pension Intelligence Agent architecture">
  <rect width="740" height="400" fill="#f7f4ee"/>
  <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e">Pension Intelligence Agent</text>
  <text x="24" y="46" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555">No answer without evidence. LLM explains only.</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#fff">
    <rect x="24" y="72" width="160" height="48" rx="6" fill="#3a4a6b"/>
    <text x="104" y="101" font-size="11">POST /v1/answers</text>
    <rect x="220" y="72" width="160" height="48" rx="6" fill="#438DD5"/>
    <text x="300" y="94" font-size="11">Application</text>
    <text x="300" y="110" font-size="8" fill="#e8f3ff">use-case · ports</text>
    <rect x="416" y="72" width="300" height="48" rx="6" fill="#2a7a6a"/>
    <text x="566" y="94" font-size="11">Idempotency · timeout · audit</text>
    <text x="566" y="110" font-size="8" fill="#e8fff8">Redis Lua · PostgreSQL</text>
  </g>
  <line x1="104" y1="120" x2="300" y2="120" stroke="#888" stroke-width="1.2"/>
  <line x1="300" y1="120" x2="300" y2="148" stroke="#888" stroke-width="1.2"/>
  <text x="24" y="168" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e1e1e">Three lanes. A sentence only after they meet.</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#fff">
    <rect x="24" y="184" width="220" height="88" rx="6" fill="#c45c26"/>
    <text x="134" y="212" font-size="12" font-weight="700">Retrieval</text>
    <text x="134" y="232" font-size="9" fill="#fff6ee">BM25 + pgvector</text>
    <text x="134" y="248" font-size="9" fill="#fff6ee">RRF · cross-encoder</text>
    <rect x="260" y="184" width="220" height="88" rx="6" fill="#6B4FBB"/>
    <text x="370" y="212" font-size="12" font-weight="700">Rules</text>
    <text x="370" y="232" font-size="9" fill="#eee8ff">timing · fit · limits</text>
    <text x="370" y="248" font-size="9" fill="#eee8ff">product constraints</text>
    <rect x="496" y="184" width="220" height="88" rx="6" fill="#2f5d3a"/>
    <text x="606" y="212" font-size="12" font-weight="700">Evidence</text>
    <text x="606" y="232" font-size="9" fill="#e8f6ea">citation · NLI check</text>
    <text x="606" y="248" font-size="9" fill="#e8f6ea">no evidence, no answer</text>
  </g>
  <line x1="134" y1="272" x2="134" y2="296" stroke="#888" stroke-width="1.2"/>
  <line x1="370" y1="272" x2="370" y2="296" stroke="#888" stroke-width="1.2"/>
  <line x1="606" y1="272" x2="606" y2="296" stroke="#888" stroke-width="1.2"/>
  <line x1="134" y1="296" x2="606" y2="296" stroke="#888" stroke-width="1.2"/>
  <line x1="370" y1="296" x2="370" y2="312" stroke="#888" stroke-width="1.2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#fff">
    <rect x="160" y="312" width="420" height="60" rx="6" fill="#1e1e1e"/>
    <text x="370" y="338" font-size="12">LLM explains. Retrieval, math, and rules decide.</text>
    <text x="370" y="356" font-size="9" fill="#ccc">answer · citations · confidence · warnings</text>
  </g>
</svg>
