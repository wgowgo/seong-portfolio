<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot Exchange</title>
  <style>
    body {
      margin: 0;
      background: #111318;
      color: #f4efe6;
      font-family: Karla, Helvetica, Arial, sans-serif;
      line-height: 1.55;
    }
    main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    a { color: #f2d089; }
    h1 { font-size: 1.7rem; line-height: 1.2; text-wrap: balance; }
    p { max-width: 65ch; text-wrap: pretty; color: #d8d2c6; }
    img { width: 100%; border: 2px solid #f4efe6; border-radius: 14px; background: #0b0d12; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 1rem 0 1.5rem; }
    .meta span {
      border: 1.5px solid #f4efe6;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <p><a href="../">← Desk</a></p>
    <h1>Dot Exchange</h1>
    <p>An engine that reduces photos into a meaning-based palette, then redraws them as dot illustrations. Ships to Android with Capacitor.</p>
    <div class="meta">
      <span>JavaScript</span>
      <span>Capacitor</span>
      <span>Android</span>
    </div>
    <img src="../pins/dot-exchange.svg" alt="Dot Exchange pipeline">
    <p>Strict 5, Balanced, and Detailed presets. Internal resolution ranges from 48 to 256.</p>
  </main>
</body>
</html>
